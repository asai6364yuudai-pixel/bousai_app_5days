{% extends "base.html" %}
{% block title %}発信登録 - {{ t('app_name') }}{% endblock %}
{% block content %}
<style>
  .register-page { width: min(820px, calc(100% - 32px)); margin: 28px auto 64px; color: #435466; }
  .register-panel { padding: 26px; border: 1px solid #dfe6ee; border-radius: 8px; background: #fff; box-shadow: 0 4px 14px rgba(41,66,102,.07); }
  .form-field { margin-bottom: 18px; } label { display: block; margin-bottom: 6px; font-weight: 700; } input[type=text], textarea, select { box-sizing: border-box; width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid #b8c2ce; border-radius: 4px; background: #fff; font: inherit; } textarea { min-height: 110px; resize: vertical; } .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .check-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; padding: 12px; border: 1px solid #e1e7ee; border-radius: 4px; } .check-grid label { font-weight: 400; } .actions { margin-top: 24px; } button { min-height: 42px; padding: 9px 18px; border: 0; border-radius: 5px; background: #2f5baa; color: #fff; font: inherit; font-weight: 700; cursor: pointer; } .message { padding: 12px 14px; border-left: 4px solid #239b4b; background: #eef9f1; font-weight: 700; } .error { border-left-color: #bd4b48; background: #fff1f0; color: #8f2926; } @media (max-width: 620px) { .register-page { width: min(100% - 20px, 560px); } .register-panel { padding: 18px; } .form-row { grid-template-columns: 1fr; gap: 0; } }
</style>
<div class="register-page">
  <h2>発信登録</h2>
  {% if message %}<p class="message" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form class="register-panel" method="post">
    <div class="form-field"><label for="content">発信内容（任意）</label><textarea id="content" name="content"></textarea></div>
    <div class="form-field"><span>対象</span><p>住民</p></div>
    <div class="form-field"><label>対象区域</label><div class="check-grid">{% for area in areas %}<label><input type="checkbox" name="area" value="{{ area }}"> {{ area }}</label>{% endfor %}</div></div>
    <div class="form-row"><div class="form-field"><label for="warning_type">警報・注意報</label><select id="warning_type" name="warning_type">{% for warning in warning_options %}<option value="{{ warning }}">{{ warning }}</option>{% endfor %}</select></div><div class="form-field"><label for="status">状態</label><select id="status" name="status"><option>未対応</option><option>対応中</option><option>完了</option></select></div></div>
    <div class="form-field"><label for="shelter">避難先（任意）</label><select id="shelter" name="shelter"><option value="">指定なし</option>{% for shelter in shelters %}<option value="{{ shelter.get('name', '') }}">{{ shelter.get('name', '') }}</option>{% endfor %}</select></div>
    <div class="actions"><button type="submit">発信を登録</button></div>
  </form>
</div>
{% endblock %}
