{% extends "base.html" %}
{% block title %}{{ t('instruction_register') }} - {{ t('app_name') }}{% endblock %}
{% block content %}
<style>
 </style>
 <div class="register-page">
  <h2>{{ t('instruction_register') }}</h2>
   {% if message %}<p class="message" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
   <form class="register-panel" method="post">
    <div class="form-row"><div class="form-field"><label for="source">{{ t('source_department') }}</label><select id="source" name="source" required><option value="">{{ t('select_option') }}</option>{% for department in departments %}<option value="{{ department }}">{{ translate_choice(department) }}</option>{% endfor %}</select></div><div class="form-field"><label for="target">{{ t('target_department') }}</label><select id="target" name="target" required><option value="">{{ t('select_option') }}</option>{% for department in departments %}<option value="{{ department }}">{{ translate_choice(department) }}</option>{% endfor %}</select></div></div>
    <div class="form-field"><label for="content">{{ t('instruction_content') }}</label><textarea id="content" name="content" required></textarea></div>
    <div class="form-row"><div class="form-field"><label for="status">{{ t('status') }}</label><select id="status" name="status">{% for status in statuses %}<option value="{{ status }}">{{ translate_choice(status) }}</option>{% endfor %}</select></div><div class="form-field"><label for="shelter">{{ t('shelter_optional') }}</label><select id="shelter" name="shelter"><option value="">{{ t('unspecified_area') }}</option>{% for shelter in shelters %}<option value="{{ shelter.get('name', '') }}">{{ shelter.get('name', '') }}</option>{% endfor %}</select></div></div>
    <div class="actions"><button type="submit">{{ t('register_instruction') }}</button></div>
   </form>
 </div>
 {% endblock %}
