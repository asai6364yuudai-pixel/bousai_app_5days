<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ t('app_name') }}{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --app-blue: #2f5baa;
      --app-green: #239b4b;
      --app-text: #506174;
      --app-muted: #66788b;
      --app-border: #f0f2f6;
      --app-surface: #ffffff;
      --app-background: #f7f8fa;
    }

    body:not(.login-page):not(.home-page) {
      margin: 0;
      background: var(--app-background);
      color: var(--app-text);
      font-family: 'Noto Sans JP', 'Yu Gothic', sans-serif;
      line-height: 1.6;
    }

    body:not(.login-page):not(.home-page) .site-header {
      box-sizing: border-box;
      min-height: 70px;
      padding: 14px max(24px, calc((100% - 1380px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--app-blue);
      color: #ffffff;
    }

    body:not(.login-page):not(.home-page) .site-header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 25px;
      font-weight: 700;
    }

    body:not(.home-page) .site-header > nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-left: auto;
      color: #ffffff;
      font-size: 14px;
    }

    body:not(.home-page) .site-header .menu-button {
      display: none;
      color: #ffffff;
    }

    body:not(.login-page):not(.home-page) main {
      width: min(1120px, calc(100% - 32px));
      margin: 32px auto 64px;
    }

    body:not(.login-page):not(.home-page) h1,
    body:not(.login-page):not(.home-page) h2,
    body:not(.login-page):not(.home-page) h3 {
      color: var(--app-blue);
    }

    body:not(.login-page):not(.home-page) input:not([type='radio']):not([type='checkbox']),
    body:not(.login-page):not(.home-page) select,
    body:not(.login-page):not(.home-page) textarea {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: var(--app-surface);
      color: #263746;
      font: inherit;
    }

    body:not(.login-page):not(.home-page) input:not([type='radio']):not([type='checkbox']):focus,
    body:not(.login-page):not(.home-page) select:focus,
    body:not(.login-page):not(.home-page) textarea:focus {
      outline: 3px solid #d7e6f8;
      border-color: var(--app-blue);
    }

    body:not(.login-page):not(.home-page) button {
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
    }

    body:not(.login-page):not(.home-page) .register-panel,
    body:not(.login-page):not(.home-page) .board-panel,
    body:not(.login-page):not(.home-page) .shelter-result {
      border: 1px solid var(--app-border);
      border-radius: 17px;
      background: var(--app-surface);
      box-shadow: 0 5px 18px rgba(41, 66, 102, 0.08);
    }

    body:not(.login-page):not(.home-page) .site-divider {
      display: none;
    }

    @media (max-width: 767px) {
      body:not(.login-page):not(.home-page) .site-header {
        flex-wrap: wrap;
        padding-right: 16px;
        padding-left: 16px;
      }

      body:not(.login-page):not(.home-page) .site-header h1 {
        font-size: 21px;
      }

      body:not(.home-page) .site-header > nav {
        display: flex;
        width: 100%;
        order: 3;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 3px;
      }

      body:not(.login-page):not(.home-page) main {
        width: min(100% - 24px, 640px);
        margin-top: 20px;
      }
    }

    .nav-button {
      display: inline-block;
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-home {
      background: #2f5baa;
    }

    .nav-search {
      background: #239b4b;
    }

    .nav-register {
      background: #d88421;
    }

    .nav-board {
      background: #7651a8;
    }

    .nav-login {
      background: #435466;
    }

    .nav-logout {
      background: #bd4b48;
    }

    .language-control {
      margin-left: 4px;
      white-space: nowrap;
    }

    .language-select {
      border: 1px solid #b8c2ce;
      border-radius: 4px;
      padding: 5px 7px;
      background: #ffffff;
      color: #435466;
      font: inherit;
    }

    .menu-button {
      border: 0;
      padding: 8px 10px;
      background: transparent;
      color: #435466;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

  </style>
</head>
<body class="{% block body_class %}app-page{% endblock %}">
  <!-- ヘッダー -->
  <header class="site-header">
    <h1>{% block site_name %}防災アプリ{% endblock %}</h1>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="siteMenu" aria-label="メニューを開く">☰</button>
    <nav id="siteMenu">
      <a class="nav-button nav-home" href="/">{{ t('home') }}</a>
      <a class="nav-button nav-search" href="/shelter_search">{{ t('shelter_search') }}</a>
      <a class="nav-button nav-register" href="/shelter_register">{{ t('shelter_register') }}</a>
      <a class="nav-button nav-board" href="/board">{{ t('board') }}</a>
      {% if session.logged_in %}
        <span>{{ t('logged_in') }}（{{ session.username }}）</span>
        <a class="nav-button nav-logout" href="/logout">{{ t('logout') }}</a>
      {% else %}
        <a class="nav-button nav-login" href="/login">{{ t('login') }}</a>
      {% endif %}
      <form method="post" action="{{ url_for('set_language') }}" class="language-control">
        <label for="languageSelect">{{ t('language') }}</label>
        <select id="languageSelect" name="language" class="language-select" aria-label="{{ t('language') }}" onchange="this.form.submit()">
          <option value="ja"{% if language == 'ja' %} selected{% endif %}>{{ t('japanese', 'ja') }}</option>
          <option value="en"{% if language == 'en' %} selected{% endif %}>{{ t('english', 'en') }}</option>
        </select>
        <input type="hidden" name="next" value="{{ request.full_path }}">
      </form>
    </nav>
  </header>

  <hr class="site-divider">

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const header = document.querySelector('.site-header');
      const button = document.querySelector('.menu-button');
      if (!header || !button) return;
      button.addEventListener('click', () => {
        const isOpen = header.classList.toggle('menu-open');
        button.setAttribute('aria-expanded', String(isOpen));
      });
    })();
  </script>
</body>
</html>
