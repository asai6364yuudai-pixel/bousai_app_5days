<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .nav-button {
      display: inline-block;
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-home {
      background: #2f5baa;
    }

    .nav-search {
      background: #239b4b;
    }

    .nav-register {
      background: #d88421;
    }

    .nav-board {
      background: #7651a8;
    }

    .nav-login {
      background: #435466;
    }

    .nav-logout {
      background: #bd4b48;
    }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- ヘッダー -->
  <header class="site-header">
    <h1>{% block site_name %}防災アプリ{% endblock %}</h1>
    <nav>
      <a class="nav-button nav-home" href="/">ホーム</a>
      <a class="nav-button nav-search" href="/shelter_search">避難所検索</a>
      <a class="nav-button nav-register" href="/shelter_register">避難所登録</a>
      <a class="nav-button nav-board" href="/board">指示・発信</a>
      {% if session.logged_in %}
        <span>ログイン中（{{ session.username }}）</span>
        <a class="nav-button nav-logout" href="/logout">ログアウト</a>
      {% else %}
        <a class="nav-button nav-login" href="/login">ログイン</a>
      {% endif %}
      {% block language_control %}{% endblock %}
    </nav>
  </header>

  <hr class="site-divider">

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
