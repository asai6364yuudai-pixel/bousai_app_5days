<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- ヘッダー -->
  <header class="site-header">
    <h1>防災アプリ</h1>
    <button class="menu-button" type="button" aria-label="メニュー">☰</button>
  </header>

  <!-- ナビゲーション -->
  <nav>
    <a href="/">ホーム</a> |
    <a href="/shelter_search">避難所検索</a> |
    <a href="/shelter_register">避難所登録</a> |
    <a href="/board">指示・発信ボード</a>
    ｜
    {% if session.logged_in %}
      ログイン中{% if session.username %}（{{ session.username }}）{% endif %}
      <a href="/logout">ログアウト</a>
    {% else %}
      未ログイン
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>
  <hr class="site-divider">

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
