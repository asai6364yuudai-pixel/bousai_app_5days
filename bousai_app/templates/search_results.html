{% extends "base.html" %}

{% block content %}
<h2>{{ t('search_results') }}</h2>

{% if results %}
  <ul>
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>{{ t('no_shelters') }}</p>
{% endif %}

<p>
  <a href="/shelter_search">{{ t('back_to_search') }}</a> |
  <a href="/">{{ t('back_to_home') }}</a>
</p>
{% endblock %}
