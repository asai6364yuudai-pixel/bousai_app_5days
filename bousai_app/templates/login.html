{% extends "base.html" %}

{% block title %}{{ t('admin_login') }}{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
<h2>{{ t('admin_login') }}</h2>
<p>{{ t('admin_notice') }}</p>

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="post">
  <!-- リダイレクト先URLを保持 -->
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <p>
    <label for="password">{{ t('password') }}（{{ t('password_hint') }}）</label><br>
    <input type="password" id="password" name="password" required>
  </p>

  <p><button type="submit">{{ t('login') }}</button></p>
</form>

{% endblock %}
